# QA descriptor for the Polycall binding matrix (read by polycall/qa/run_qa.py).
# This repository is NOT a Python package and is not pip-installable;
# its native manifest is package.json.
[tool.polycall.binding]
name = "node-polycall"
language = "JavaScript (Node.js)"
native_manifest = "package.json"
registry = "npm"
package = "@obinexuscomputing/node-polycall"
abi = 1
support = "supported"
linux_image = "node:22"
build = "npm pack"
test = "sh /qa/build-linux-core.sh && POLYCALL_CLI=/opt/polycall/bin/polycall POLYCALL_REQUIRE_CLI=1 npm test"
windows_test = "set POLYCALL_CLI=<.qa-core>\\windows-msvc-x64\\bin\\polycall.exe && set POLYCALL_REQUIRE_CLI=1 && npm test"

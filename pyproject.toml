# QA descriptor for the Polycall binding matrix (read by polycall/qa/run_qa.py).
# This repository is NOT a Python package and is not pip-installable;
# its native manifest is package.json.
[tool.polycall.binding]
name = "node-polycall"
language = "JavaScript (Node.js)"
native_manifest = "package.json"
registry = "npm"
package = "@obinexuscomputing/node-polycall"
abi = 1
support = "supported"
# node:26 runs every suite (the native layer needs node:ffi, Node.js >= 26);
# node:20 / node:22 run unit + core, and report the native suite as skipped.
linux_image = "node:26"
build = "npm pack"
test = "sh /qa/build-linux-core.sh && POLYCALL_CLI=/opt/polycall/bin/polycall POLYCALL_LIBRARY=/opt/polycall/lib/libpolycall.so.1 POLYCALL_REQUIRE_CLI=1 POLYCALL_REQUIRE_NATIVE=1 npm test"
windows_test = "set POLYCALL_CLI=<.qa-core>\\windows-<msvc|ucrt64>-x64\\bin\\polycall.exe && set POLYCALL_LIBRARY=<.qa-core>\\windows-msvc-x64\\bin\\polycall.dll (or windows-ucrt64-x64\\bin\\libpolycall.dll) && set CC=<gcc for the loader fixtures> && set POLYCALL_REQUIRE_CLI=1 && set POLYCALL_REQUIRE_NATIVE=1 && npm test"
